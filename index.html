<style>
:root{color-scheme:dark;--night:#0f2a3d;--dusk:#2b2a63;--gold:#ffcf5c;--cream:#fff4d6;--red:#c8452f;--pine:#3f7a54;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;background:#07121c;color:var(--cream);font-family:'Fredoka',system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:12px}
.stage{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:var(--night)}
svg{position:absolute;inset:0;width:100%;height:100%}
#cap{position:absolute;left:0;right:0;bottom:3%;text-align:center;padding:0 6%;font-size:clamp(15px,3.2vw,30px);font-weight:600;color:var(--cream);text-shadow:0 2px 8px #000,0 0 3px #000;min-height:1.3em;transition:opacity .4s}

#go small{font-size:.5em;color:var(--cream);font-weight:400}
#go:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
audio{flex:1 1 260px;min-width:0}
button.s,label.s{background:#1b3a52;color:var(--cream);border:1px solid #3b6a8c;border-radius:10px;padding:8px 14px;font:400 15px 'Fredoka',sans-serif;cursor:pointer}
#fb{display:none;margin-top:10px;font-size:15px}
.sc{opacity:0;transition:opacity 1.2s;pointer-events:none}.sc.on{opacity:1}
.d{opacity:0;transition:opacity .9s}.on .d{opacity:1}
.tw{animation:tw 3s ease-in-out infinite alternate}@keyframes tw{from{opacity:.2}to{opacity:1}}
.sn{animation:fall linear infinite}@keyframes fall{to{transform:translateY(470px)}}
.pulse{animation:pl 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}@keyframes pl{to{transform:scale(1.15)}}
.walk{transform:translateX(-380px);transition:transform 14s linear}.on .walk{transform:none}
.drop{transform:translate(560px,30px);transition:transform 5s ease-out}.on .drop{transform:translate(560px,150px)}
.rise{transform:translate(400px,215px);transition:transform 24s ease-in-out}.on .rise{transform:translate(400px,70px)}
.spin{animation:sp 40s linear infinite;transform-origin:400px 225px}@keyframes sp{to{transform:rotate(360deg)}}
.hand{animation:sp 4s linear infinite;transform-box:fill-box;transform-origin:50% 100%}
.bob{animation:bb .9s ease-in-out infinite alternate}@keyframes bb{to{transform:translateY(-8px)}}
.fl{animation:fl 4s ease-in-out infinite alternate}@keyframes fl{to{transform:translateY(-10px)}}
.bell{animation:sw 1.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0}@keyframes sw{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.nt{animation:nt 4s ease-in infinite;font-size:26px;fill:var(--gold)}@keyframes nt{from{transform:translateY(0);opacity:1}to{transform:translateY(-90px);opacity:0}}
.cl1{animation:c1 3s ease-in-out infinite alternate}.cl2{animation:c2 3s ease-in-out infinite alternate}
@keyframes c1{to{transform:translateX(-150px)}}@keyframes c2{to{transform:translateX(150px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
